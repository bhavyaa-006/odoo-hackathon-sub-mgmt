services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightloop}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop-dev-password}
    volumes:
      - brightloop_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
    image: brightloop-product-service:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-brightloop}:${POSTGRES_PASSWORD:-brightloop-dev-password}@db:5432/${POSTGRES_DB:-brightloop}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      JWT_ALGORITHM: HS256
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  brightloop_postgres_data:
